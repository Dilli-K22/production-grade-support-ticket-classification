name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-runtime.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: support-ticket-classifier-api:ci

      - name: Run container smoke tests
        run: |
          docker run -d --name ticket-api -p 8000:8000 support-ticket-classifier-api:ci

          cleanup() {
            docker logs ticket-api || true
            docker rm -f ticket-api || true
          }
          trap cleanup EXIT

          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:8000/health
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:8000/health/ready
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors \
            -H "Content-Type: application/json" \
            -d '{"ticket_text":"I cannot connect to the company VPN from my laptop"}' \
            http://localhost:8000/predict
