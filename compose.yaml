
services:
  api:
    build: .
    image: support-ticket-classifier-api:latest
    container_name: support-ticket-api

    ports:
      - "8000:8000"

    environment:
      TICKET_ENVIRONMENT: production
      TICKET_LOG_LEVEL: INFO
      MONITORING_DATABASE_PATH: /app/data/monitoring.db

    volumes:
      - monitoring_data:/app/data
      - app_logs:/app/logs

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  monitoring_data:
    external: true
  app_logs:
